name: Release dictionary dataset

# Builds the dictionary dataset from the pinned sources and attaches it to a GitHub release.
# Runs only when a tag named dictionary-v* is pushed, for example dictionary-v2026.11.1.
on:
  push:
    tags:
      - 'dictionary-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch the pinned sources
        run: node tools/dictionary/fetch.mjs
      - name: Build the dataset
        run: node tools/dictionary/build.mjs
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=data/dictionary/dist/dictionary.jsonl.gz
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "Dictionary dataset $GITHUB_REF_NAME" \
              --notes "Built from the pinned sources in data/dictionary/sources.json. See data/dictionary/SOURCES.md and data/dictionary/LICENSE. Every entry is external-unreviewed."
          fi
