name: Release dictionary dataset

# Builds the dictionary dataset from the pinned sources and attaches it to a GitHub release.
# Runs only when a tag named dictionary-v* is pushed. The first tag is dictionary-v1.
#
# The pinned checksums in data/dictionary/sources.json go stale: MDBG regenerates the CC-CEDICT
# export daily and Tatoeba replaces its exports weekly, and the fetch step fails on a mismatch.
# So before tagging: run `node tools/dictionary/fetch.mjs --update-pins`, update `version` in
# sources.json, run `node tools/dictionary/fetch.mjs` and the build, merge that change, and push
# the tag immediately afterwards (see data/dictionary/README.md, "Releasing").
on:
  push:
    tags:
      - 'dictionary-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch the pinned sources
        run: node tools/dictionary/fetch.mjs
      - name: Build the dataset
        run: node tools/dictionary/build.mjs
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="data/dictionary/dist/dictionary.jsonl.gz data/dictionary/LICENSE data/dictionary/SOURCES.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES \
              --title "Dictionary dataset $GITHUB_REF_NAME" \
              --notes "Built from the pinned sources in data/dictionary/sources.json. LICENSE (CC BY-SA 4.0, with the credits for CC-Canto, CC-CEDICT, Tatoeba and HKCanCor) and SOURCES.md are attached and must travel with the dataset. Every entry is external-unreviewed."
          fi
