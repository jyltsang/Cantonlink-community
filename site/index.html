<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://openrouter.ai https://api.groq.com https://api.together.xyz https://api.deepseek.com https://api.mistral.ai http://localhost:* http://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Learn Cantonese · CantonLink Community</title>
  <meta name="description" content="Free, open lessons and practice for spoken Hong Kong Cantonese: grammar, vocabulary, flashcards, tones and more, in Jyutping, Yale or Bopomofo.">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-row">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">粵</span>
        <span class="brand-text">CantonLink <span class="brand-sub">Community Edition</span></span>
      </a>
      <details class="settings">
        <summary>Display</summary>
        <div class="settings-panel">
          <fieldset>
            <legend>Romanisation</legend>
            <label><input type="radio" name="system" value="jyutping"> Jyutping</label>
            <label><input type="radio" name="system" value="yale"> Yale</label>
            <label><input type="radio" name="system" value="bopomofo"> Bopomofo</label>
          </fieldset>
          <fieldset>
            <legend>Also show</legend>
            <label><input type="checkbox" name="showCjk"> 漢字 characters</label>
          </fieldset>
        </div>
      </details>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="#/path">Path</a>
      <a href="#/grammar">Grammar</a>
      <a href="#/vocabulary">Words</a>
      <a href="#/lookup">Look up</a>
      <a href="#/tutor" aria-label="AI tutor">Tutor</a>
      <a href="#/review">Review<span id="review-count"></span></a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="panel">This site needs JavaScript. The same lessons are available as readable pages in the <a href="https://github.com/jyltsang/Cantonlink-community/tree/main/library">library on GitHub</a>.</p></noscript>
    <div id="app"><p class="loading">Loading…</p></div>
  </main>

  <footer class="site-footer">
    <p>Content <a href="https://github.com/jyltsang/Cantonlink-community/blob/main/LICENSE-CONTENT">CC BY-SA 4.0</a> · Code <a href="https://github.com/jyltsang/Cantonlink-community/blob/main/LICENSE">MIT</a> · <a href="https://github.com/jyltsang/Cantonlink-community">Source on GitHub</a> · <a href="https://github.com/jyltsang/Cantonlink-community/blob/main/library/review-status.md">Review status</a></p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
